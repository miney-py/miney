name: miney CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  pytest:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7
      - name: Install dependencies
        # "--group" reads [dependency-groups] from pyproject.toml (PEP 735) and
        # needs pip 25.1 or newer, which the runner image does not ship yet.
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
      - name: Execute tests
        run: pytest

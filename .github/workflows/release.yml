name: miney Release
on:
  release:
    types: [published]
jobs:
  release:
    name: 📦 Publish
    runs-on: ubuntu-latest
    permissions:
      # Naming any permission sets every unnamed one to "none", so checkout needs
      # its read access spelled out here.
      contents: read
      # Required for PyPI Trusted Publishing - no API token is stored anywhere.
      id-token: write
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      # The published version comes from miney.__version__, not from the tag. Catch a
      # forgotten version bump here, before anything is published - PyPI would reject
      # the duplicate only after ContentDB already got its release.
      - name: Verify the tag matches miney.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import miney; print(miney.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag, miney.__version__ says $version."
            echo "Bump __version__ in miney/__init__.py or retag."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes a re-run after a later step failed a no-op instead of an error.
          skip-existing: true

      - name: Publish to ContentDB
        env:
          CONTENTDB_API_TOKEN: ${{ secrets.CONTENTDB_API_TOKEN }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          # ContentDB's "git" method clones the repository and expects to find a mod
          # at its root. Ours lives in mod_data/, and the API has no field to point
          # at a subdirectory, so upload the mod folder as a zip instead.
          (cd mod_data && zip -q -r ../miney-mod.zip miney)
          # Write the notes to a file: curl -F reads a leading "@" or "<" in an
          # inline value as a filename, and release notes may start with anything.
          printf '%s' "$RELEASE_NOTES" > release-notes.md
          curl --fail-with-body -sS \
              -X POST "https://content.luanti.org/api/packages/Miney/miney/releases/new/" \
              -H "Authorization: Bearer $CONTENTDB_API_TOKEN" \
              -F "title=$GITHUB_REF_NAME" \
              -F "commit=$GITHUB_SHA" \
              -F "release_notes=<release-notes.md" \
              -F "file=@miney-mod.zip"
